<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Expense - F2 Expense Split</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<button id="menuButton" class="menu-button">☰</button>

<aside id="sidebar" class="sidebar">

    <div class="sidebar-header">
        <h2>F2 Expense Split</h2>
        <button id="closeSidebar" class="close-button">×</button>
    </div>

    <nav>
        <a href="people.html">👥 People</a>
        <a href="payments.html">💳 Actual Payments</a>
        <a href="expenses.html">➕ Add Expense</a>
        <a href="details.html">📋 Expense Details</a>
        <a href="balance.html">💰 Final Balance</a>
        <a href="statistics.html">📊 Monthly Statistics</a>
    </nav>

</aside>

<main>

    <header>
        <h1>F2 Expense Split</h1>
        <p>Shared Expense Manager</p>
    </header>

    <section class="card">

        <h2>Add Expense</h2>

        <label>Expense Type</label>
        <select id="expenseType">
            <option value="">Select Type</option>
            <option value="Grocery">Grocery</option>
            <option value="Food">Food</option>
            <option value="Taxi">Taxi</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Hospital">Hospital</option>
            <option value="Pharmacy">Pharmacy</option>
            <option value="WiFi">WiFi</option>
            <option value="Water">Water</option>
            <option value="Gas">Gas</option>
            <option value="Other">Other</option>
        </select>

        <label>Item / Description</label>
        <input
            type="text"
            id="expenseDescription"
            placeholder="Example: Noodles"
        >

        <label>Total Amount (AED)</label>
        <input
            type="number"
            id="expenseAmount"
            placeholder="Example: 14"
            step="0.01"
            min="0"
        >

        <label>Who Should Share This Expense?</label>

        <div class="expense-members">

            <label class="member-checkbox">
                <input
                    type="checkbox"
                    class="expense-member"
                    value="0"
                >
                <span id="expenseMember0">Person 1</span>
            </label>

            <label class="member-checkbox">
                <input
                    type="checkbox"
                    class="expense-member"
                    value="1"
                >
                <span id="expenseMember1">Person 2</span>
            </label>

            <label class="member-checkbox">
                <input
                    type="checkbox"
                    class="expense-member"
                    value="2"
                >
                <span id="expenseMember2">Person 3</span>
            </label>

            <label class="member-checkbox">
                <input
                    type="checkbox"
                    class="expense-member"
                    value="3"
                >
                <span id="expenseMember3">Person 4</span>
            </label>

            <label class="member-checkbox">
                <input
                    type="checkbox"
                    class="expense-member"
                    value="4"
                >
                <span id="expenseMember4">Person 5</span>
            </label>

            <label class="member-checkbox">
                <input
                    type="checkbox"
                    class="expense-member"
                    value="5"
                >
                <span id="expenseMember5">Person 6</span>
            </label>

        </div>

        <button id="addExpense">Add Expense</button>

    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>

</body>
</html>
