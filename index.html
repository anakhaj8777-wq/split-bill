<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pink Split</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>F2 Expense Split</h1>
    <p>Shared Expense Manager</p>
</header>

<main>

    <section class="card">
        <h2>People</h2>

        <div class="people-grid">
            <input type="text" class="member-name" placeholder="Person 1">
            <input type="text" class="member-name" placeholder="Person 2">
            <input type="text" class="member-name" placeholder="Person 3">
            <input type="text" class="member-name" placeholder="Person 4">
            <input type="text" class="member-name" placeholder="Person 5">
            <input type="text" class="member-name" placeholder="Person 6">
        </div>
    </section>

    <section class="card">
        <h2>Add Expense</h2>

        <label>Expense Type</label>

        <select id="expenseType">
            <option value="">Select Type</option>
            <option value="Grocery">Grocery</option>
            <option value="Food">Food</option>
            <option value="Taxi">Taxi</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Hospital">Hospital</option>
            <option value="Pharmacy">Pharmacy</option>
            <option value="WiFi">WiFi</option>
            <option value="Water">Water</option>
            <option value="Gas">Gas</option>
            <option value="Other">Other</option>
        </select>

        <label>Item / Description</label>

        <input
            type="text"
            id="expenseDescription"
            placeholder="Example: Noodles"
        >

        <label>Total Amount (AED)</label>

        <input
            type="number"
            id="expenseAmount"
            placeholder="Example: 14"
            step="0.01"
            min="0"
        >

        <label>Who Should Share This Expense?</label>

        <div class="expense-members">

            <label class="member-checkbox">
                <input type="checkbox" class="expense-member" value="0">
                <span id="expenseMember0">Person 1</span>
            </label>

            <label class="member-checkbox">
                <input type="checkbox" class="expense-member" value="1">
                <span id="expenseMember1">Person 2</span>
            </label>

            <label class="member-checkbox">
                <input type="checkbox" class="expense-member" value="2">
                <span id="expenseMember2">Person 3</span>
            </label>

            <label class="member-checkbox">
                <input type="checkbox" class="expense-member" value="3">
                <span id="expenseMember3">Person 4</span>
            </label>

            <label class="member-checkbox">
                <input type="checkbox" class="expense-member" value="4">
                <span id="expenseMember4">Person 5</span>
            </label>

            <label class="member-checkbox">
                <input type="checkbox" class="expense-member" value="5">
                <span id="expenseMember5">Person 6</span>
            </label>

        </div>

        <button id="addExpense">Add Expense</button>
    </section>

    <section class="card">
        <h2>Actual Payments</h2>

        <label>Paid By</label>

        <select id="paidBy"></select>

        <label>Category</label>

        <select id="paymentCategory">
            <option value="">Select Category</option>
            <option value="Grocery">Grocery</option>
            <option value="Food">Food</option>
            <option value="Taxi">Taxi</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Hospital">Hospital</option>
            <option value="Pharmacy">Pharmacy</option>
            <option value="WiFi">WiFi</option>
            <option value="Water">Water</option>
            <option value="Gas">Gas</option>
            <option value="Other">Other</option>
        </select>

        <label>Amount (AED)</label>

        <input
            type="number"
            id="paymentAmount"
            placeholder="Example: 60"
            step="0.01"
            min="0"
        >

        <button id="addPayment">Add Payment</button>

        <div id="paymentList"></div>
    </section>

    <section class="card">
        <h2>Expense Details</h2>

        <div id="expenseSections"></div>
    </section>

    <section class="card">
        <h2>Final Balance</h2>

        <div id="balanceList"></div>
    </section>

</main>

<script src="script.js"></script>

</body>
</html>
