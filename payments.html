<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payments - F2 Expense Split</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<button id="menuButton" class="menu-button">☰</button>

<aside id="sidebar" class="sidebar">

    <div class="sidebar-header">
        <h2>F2 Expense Split</h2>
        <button id="closeSidebar" class="close-button">×</button>
    </div>

    <nav>
        <a href="people.html">👥 People</a>
        <a href="payments.html">💳 Actual Payments</a>
        <a href="expenses.html">➕ Add Expense</a>
        <a href="details.html">📋 Expense Details</a>
        <a href="balance.html">💰 Final Balance</a>
        <a href="statistics.html">📊 Monthly Statistics</a>
    </nav>

</aside>

<main>

    <header>
        <h1>F2 Expense Split</h1>
        <p>Shared Expense Manager</p>
    </header>

    <section class="card">

        <div class="section-title">
            <h2>Actual Payments</h2>
            <button id="clearPayments" class="clear-all-btn">
                Clear All
            </button>
        </div>

        <label>Paid By</label>
        <select id="paidBy"></select>

        <label>Category</label>
        <select id="paymentCategory">
            <option value="">Select Category</option>
            <option value="Grocery">Grocery</option>
            <option value="Food">Food</option>
            <option value="Taxi">Taxi</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Hospital">Hospital</option>
            <option value="Pharmacy">Pharmacy</option>
            <option value="WiFi">WiFi</option>
            <option value="Water">Water</option>
            <option value="Gas">Gas</option>
            <option value="Other">Other</option>
        </select>

        <label>Amount (AED)</label>
        <input
            type="number"
            id="paymentAmount"
            placeholder="Example: 60"
            step="0.01"
            min="0"
        >

        <button id="addPayment">Add Payment</button>

        <div id="paymentList"></div>

    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>

</body>
</html>
